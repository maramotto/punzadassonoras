server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Relativa, no absoluta: el contenedor no sabe que detras del proxy
    # inverso del host la peticion real es https://universopunzadas.com, asi
    # que una redireccion absoluta (p.ej. /explorar -> /explorar/) se iria a
    # http://localhost sin esto -- mismo motivo por el que existe
    # X-Forwarded-Proto en la config de nginx del host.
    absolute_redirect off;

    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Assets con hash en el nombre (JS/CSS de Astro): cache larga e inmutable
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Datos de la web (index.json, busqueda.json...): sin hash en el nombre,
    # cambian en cada despliegue. Cache corta para no servir datos viejos.
    location /data/ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    location ~* \.(svg|woff2|png|jpg|jpeg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
